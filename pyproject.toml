[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftwm"
version = "0.1.0"
description = "Compact world models under crossed observation and dynamics shifts"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shiftwm.vendor.lewm" = ["LICENSE", "NOTICE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
